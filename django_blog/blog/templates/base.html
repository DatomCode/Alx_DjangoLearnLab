<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Django Blog{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
</head>
<body>
  <nav>
    <a href="/">Home</a>
    {% if user.is_authenticated %}
      <a href="{% url 'blog:profile' %}">Profile</a>
      <a href="{% url 'blog:logout' %}">Logout</a>
    {% else %}
      <a href="{% url 'blog:login' %}">Login</a>
      <a href="{% url 'blog:register' %}">Register</a>
    {% endif %}
  </nav>

  {% if messages %}
    <ul class="messages">
      {% for message in messages %}
        <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  {% block content %}{% endblock %}
</body>
</html>


<form method="get" action="{% url 'blog:post-search' %}">
  <input type="text" name="q" placeholder="Search posts..." required>
  <button type="submit">Search</button>
</form>
